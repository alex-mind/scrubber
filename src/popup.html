<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fff;
    --fg: #16181d;
    --dim: #71757e;
    --line: #e8e9ed;
    --field: #f5f5f7;
    --accent: #d61f58;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --fg: #e9eaee;
      --dim: #9a9ea8;
      --line: #292b31;
      --field: #212328;
      --accent: #ff6f9c;
    }
  }
  * { box-sizing: border-box; }
  body {
    width: 300px;
    margin: 0;
    padding: 18px 18px 16px;
    font: 400 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    letter-spacing: -.005em;
  }
  h1 { margin: 0; font-size: 14px; font-weight: 600; letter-spacing: -.01em; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

  /* What it found here, beside the name rather than in a panel of its own. */
  .count {
    color: var(--dim);
    font-size: 11.5px;
    text-align: right;
  }
  .count b {
    color: var(--accent);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  .group { display: flex; flex-direction: column; margin-top: 14px; }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 36px;
    padding: 6px 0;
    border-top: 1px solid var(--line);
  }
  .group .row:first-child { border-top: 0; }
  .row .t { flex: 1 1 auto; min-width: 0; }
  .row label { cursor: pointer; }
  .row .c { flex: none; display: flex; align-items: center; justify-content: flex-end; width: 56px; }

  /* A setting that belongs to the one above it. */
  .row.sub { padding-left: 14px; border-top: 0; min-height: 30px; }
  .row.sub .t { color: var(--dim); font-size: 12px; }
  .row.sub.off { opacity: .4; pointer-events: none; }

  input[type=checkbox] { margin: 0; accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  input[type=number] {
    width: 56px;
    padding: 5px 7px;
    font: inherit;
    font-variant-numeric: tabular-nums;
    text-align: right;
    border: 1px solid transparent;
    border-radius: 7px;
    background: var(--field);
    color: inherit;
  }
  input[type=number]:focus { outline: none; border-color: var(--accent); }

  /* The stretch a hover gathers from. A slider, because the useful range is
     short and the right answer is found by feel, not by typing a number. */
  .row.wide { align-items: center; }
  input[type=range] {
    display: block;
    width: 100%;
    margin: 6px 0 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .val {
    color: var(--dim);
    font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  details { margin-top: 12px; border-top: 1px solid var(--line); }
  details .group { margin-top: 0; }
  summary {
    padding: 10px 0 2px;
    color: var(--dim);
    font-size: 11.5px;
    cursor: pointer;
    list-style: none;
  }
  summary::-webkit-details-marker { display: none; }
  summary::before { content: '\203A'; display: inline-block; width: 12px; transition: transform .12s ease; }
  details[open] summary::before { transform: rotate(90deg); }

  button {
    width: 100%;
    padding: 8px;
    font: 500 12px/1 inherit;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: transparent;
    color: inherit;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--field); }
  button:disabled { opacity: .45; cursor: default; }
  .danger { margin-top: 14px; color: var(--dim); }
</style>
</head>
<body>
  <div class="head">
    <h1>Scrubber</h1>
    <span class="count" id="count"></span>
  </div>

  <div class="group">
    <div class="row">
      <span class="t"><label for="enabled">Enabled</label></span>
      <span class="c"><input type="checkbox" id="enabled"></span>
    </div>
    <div class="row">
      <span class="t"><label for="showPopout">Highlight popular comments</label></span>
      <span class="c"><input type="checkbox" id="showPopout"></span>
    </div>
    <div class="row sub" id="minLikesRow">
      <span class="t"><label for="minLikes">Minimum likes</label></span>
      <span class="c"><input type="number" id="minLikes" min="0" step="1"></span>
    </div>
  </div>

  <details>
    <summary>Advanced</summary>
    <div class="group">
      <div class="row sub">
        <span class="t"><label for="cooldown">Quiet seconds between pop-ups</label></span>
        <span class="c"><input type="number" id="cooldown" min="5" step="5"></span>
      </div>
      <div class="row sub wide">
        <span class="t"><label for="windowSec">Selection width</label>
          <input type="range" id="windowSec" min="0" max="60" step="5"></span>
        <span class="c"><span class="val" id="windowVal"></span></span>
      </div>
    </div>
    <button id="loadMore">Load more comments</button>
  </details>

  <div class="danger"><button id="clearCache">Clear cached comments</button></div>

  <script src="compat.js"></script>
  <script src="popup.js"></script>
</body>
</html>
